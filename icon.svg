<svg xmlns="http://www.w3.org/2000/svg" viewBox="66 70 392 392" role="img" aria-label="HMI Designer">
  <!-- The espOS logo, transparent: the wave cuts its gap out of the bottle
       through a mask rather than a white outline, so it reads on dark
       backgrounds too. -->
  <defs>
    <path id="wave" d="M 78,330 C 140,416 300,424 446,318 C 410,384 320,446 214,442 C 140,438 96,392 78,330 Z"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="66" y="70" width="392" height="392">
      <rect x="66" y="70" width="392" height="392" fill="#fff"/>
      <use href="#wave" fill="#000" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g transform="translate(262,250) rotate(28) scale(1.12)">
      <path d="M -70,100 L -70,-30 Q -70,-78 -24,-92 L -24,-128 L -31,-128 L -31,-152 L 31,-152 L 31,-128 L 24,-128 L 24,-92 Q 70,-78 70,-30 L 70,100 Q 70,118 52,118 L -52,118 Q -70,118 -70,100 Z" fill="#003399"/>
      <g transform="translate(0,18) scale(2.6) translate(-32,-32)" fill="#FBCA02">
        <rect x="17" y="17" width="30" height="30" rx="4"/>
        <rect x="24" y="24" width="16" height="16" rx="2" fill="#003399"/>
        <rect x="20" y="11" width="3" height="6" rx="1"/>
        <rect x="30.5" y="11" width="3" height="6" rx="1"/>
        <rect x="41" y="11" width="3" height="6" rx="1"/>
        <rect x="20" y="47" width="3" height="6" rx="1"/>
        <rect x="30.5" y="47" width="3" height="6" rx="1"/>
        <rect x="41" y="47" width="3" height="6" rx="1"/>
        <rect x="11" y="20" width="6" height="3" rx="1"/>
        <rect x="11" y="30.5" width="6" height="3" rx="1"/>
        <rect x="11" y="41" width="6" height="3" rx="1"/>
        <rect x="47" y="20" width="6" height="3" rx="1"/>
        <rect x="47" y="30.5" width="6" height="3" rx="1"/>
        <rect x="47" y="41" width="6" height="3" rx="1"/>
      </g>
    </g>
  </g>
  <use href="#wave" fill="#003399"/>
</svg>
